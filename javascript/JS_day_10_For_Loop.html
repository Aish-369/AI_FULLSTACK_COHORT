<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>


        // for loop -: Used for iterating and one of the easiest way to write looping statement
        // we can write looping statement in single line

        // syntax -:  for(initialization;condition,inc/dec)


        for (let i = 0; i <= 30; i++) {
            document.write("Hello World...! <br>");
        }


        for (let i = 2; i <= 30; i++) {
            document.write("Hello World...! <br>");
        }




        for (let i = 1; i <= 15; i++) {
            console.log("Table of " + i);

            for (let j = 1; j <= 10; j++) {
                console.log((i * j));
            }
        }

        // we can write for loop without initialization
        let i = 0;
        for (; ;) {
            while (i <= 10) {
                console.log(i);
                i++;
            }
            break;
        }


    </script>
</body>

</html>
