    <!-- return keyword
        1. return keyword is used to return data outside the function
        2. It returns the value itself to that function
        3. It stops the function execution after returning
    -->



    <script>

        function Demo(x, y, z) {
            // console.log(x+y+z);
            return x + y + z;
        }
        let result = Demo(10, 30, 60);
        console.log(result);

        }
        Demo3("Aishwarya", "AI Developer")

        //-------------------------------------------------------


        let withdrawAmount = Number(prompt("Enter Withdraw amount"));
        let depositAmount = Number(prompt("Enter deposit amount"));
        let total = 10000000;

        function withdraw(total, amount) {
            return total - amount;
        }

        function deposit(total, amount) {
            return total + amount;
        }

        let newAmount = withdraw(total, withdrawAmount);
        alert(newAmount);

        newAmount = deposit(total, depositAmount);
        alert(newAmount);



    </script>
