<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Day 2</title>

    <style>
        body {
            margin: 0;
            padding: 35px 38px;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 28px;
            margin: 0 0 10px;
        }

        button {
            padding: 2px 8px;
            cursor: pointer;
        }

        hr {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        p {
            margin: 8px 0;
        }

        h2 {
            font-family: Georgia, serif;
            font-size: 25px;
            margin: 15px 0 12px;
        }

        .car {
            width: 293px;
            height: 293px;
            object-fit: cover;
            display: block;
        }

        .orange-box {
            width: 100%;
            height: 150px;
            background-color: greenyellow;
            margin-top: 0;
        }
    </style>
</head>

<body>

    <h1>Click Here</h1>

    <button onclick="showMessage()">Click Here</button>

    <hr>

    <p>JS is a Scripting Language</p>

    <h2>JS is invented by Brenden Eich</h2>

    <img
        class="car"
        src="https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=600&q=80"
        alt="BMW Car"
    >

    <div class="orange-box"></div>


    <script>
        // console.log()
        console.log("Hello I am Aishhh");

        // console.warn()
        console.warn("This is a Warning");

        // console.error()
        console.error("This is an Error");

        // console.dir()
        console.dir("This is dir");


        // Button click
        function showMessage() {
            alert("Hello! welcome.");
        }
    </script>

</body>
</html>
