<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- code above closing head tag -->
    <script>
        alert(" JS above Head Tag");
    </script>

</head>
<body>
    <h1 class="text-center">Welcome To Modern JS Module</h1>
    <hr>


<!--
Ways of writing JS-:
    1. Inline JS - same line with html elements
    2. Internal JS - same file with <script></script>
            option 1 - Above closing of head tag
            option 2 - Above closing of body tag
    3. External JS - separate file with .js extension and import using <script src=""></script>
-->

    <!-- Inline JS -->
    <button onclick=""></button>


    <!-- code above body closing tag -->
    <script>
        alert(" JS above body Tag");
    </script>


    <!-- External JS file -->
    <script src="day_2.js"></script>

</body>
</html>
