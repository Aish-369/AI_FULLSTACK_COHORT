<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


        <!-- alert() - built in function - pop up box - modal box
        console.log() - developer tool - helpful for test or debug
        document.write() - on browser window -->


    <script>

        // alert pop up
        alert("alert code");

        // document.write
        document.write("This is Document.write code");
        document.write("<div style='height:300px; width:300px; background-color:red;'></div>");
        document.write("<img src='../assets/nature.jpg'>");

        // console.log
        console.log(" This is console code");

        // for warning message
        console.warn(" This is console warning code");

        // for error message
        console.error(" This is console error code");

        console.dir("This is dir code");

        //
        console.table();

    </script>


</body>
</html>
