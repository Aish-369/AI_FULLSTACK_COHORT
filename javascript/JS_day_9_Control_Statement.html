    <h1>Control Statements</h1>



    <script>


    // Control Statements -:


        // if -: Used to check one condition at a time
        // Syntax-:
            if(condition)
            {
                // block of code
            }


//-------------------------------------------------------------------------------------------------------------------------


        // if else-: Used to check two condition at a time
            if(condition)
            {
                // true
                // block of code
            }
            else
            {
                // false
                // block of code
            }


//-------------------------------------------------------------------------------------------------------------------------


        // if else if else -: Used to check two or more condition at a time
            if(condition)
            {
                // true
                // block of code
            }
            else if (condition)
            {
                // block of code
            }
            else if (condition)
            {
                // block of code
            }
            else if (condition)
            {
                // block of code
            }
            else
            {
                // block of code
            }


//-------------------------------------------------------------------------------------------------------------------------


        // switch-: Used to check multiple condition at a same time
        switch(data)
        {
            case 1:
                // block of code
                break;

            case 2:
                // block of code
                break;

            case 3:
                // block of code
                break;

            case 4:
                // block of code
                break;

            default:
                // default code
        }










        // if
        let str="Full Stack Engineer";
        if(str)
        {
            console.log(`Welcome ${str}`);
        }


        // if else
        let age =prompt("Enter Your Age");

        }



        let num1=Number(prompt("Enter num1"));

        if(operation=="Add")

            document.write(`Addition is ${num1} + ${num2}`)
        }

        {
            document.write(`Addition is ${num1} * ${num2}`)
        }



        






    </script>
