<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Basics</title>
</head>

<body>

    <!-- Inline JavaScript -->
    <button onclick="alert('Hello Aishwarya')">Click Here</button>


    <!-- Internal JavaScript -->
    <script>

        document.write("Hello Aishwarya, Welcome to JavaScript");

        console.log("Hello Welcome to Modern JavaScript");

        alert("Hello Welcome to JavaScript");

    </script>

    <!-- Camel Case -->

    
        let firstName = "Aishwarya";
        let totalMarks = 90;
        let studentAge = 21;

    


    <!-- Pascal Case -->

    <!-- Every word starts with a capital letter -->

    <!-- Examples:

        let FirstName = "Aishwarya";
        let TotalMarks = 90;
        let StudentAge = 21;

    -->


    <!-- Snake Case -->

    <!-- Words are separated using underscore -->

    <!-- Examples:

        let first_name = "Aishwarya";
        let total_marks = 90;
        let student_age = 21;

    -->

</body>

</html>
