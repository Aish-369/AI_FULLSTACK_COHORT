<body>
    <h1>iframe tag</h1>
    <hr>
    <!-- used to integrate-youtube videos,google map,other's website -->
    <!-- attributes- frameborder-for apply border to frame -->

    <iframe src="" frameborder="0" height="" width=""></iframe>

    <!-- for integrate google map -->
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3783.596567928883!2d73.81668275000001!3d18.501924499999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bfc06a6582bf%3A0x4aa5dbe7079b5804!2sSuccess%20Square%2C%20Paschimanagri%2C%20Kothrud%2C%20Pune%2C%20Maharashtra%20411038!5e0!3m2!1sen!2sin!4v1784173516413!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <!-- for integrate YouTube videos -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/jNJH6uD5LQE?si=8h7El-dm5XPsY-aL" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <!-- for integrate 3rd party website in our website -->
    <iframe src="https://www.pratiksabale.com" frameborder="0" height="400px" width="600px"></iframe>
</body>
</html>
