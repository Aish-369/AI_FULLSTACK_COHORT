<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Table Tag</h1>
    <hr>

    <!-- it is used to display user/student/personal/government info into table format -->
    <!-- attributes -
    -height
    -width
    -border- to apply border
    -cellspacing-space from outside in px
    -cellpadding-space from inside in px -->

    <table>
        <tr>
            <th>table row</th>
        </tr>
        <tr>
            <th>table heading</th>
        </tr>
        <tr>
            <td>table data</td>
        </tr>
    </table>

    <hr>


    <table border="2">
        <tr>
            <th>Student Info</th>
        </tr>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>skill</th>
            <th>Address</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Aishwarya</td>
            <td>HTML</td>
            <td>Pune</td>
        </tr>
        <tr>
            <td>102</td>
            <td>ABC</td>
            <td>CSS</td>
            <td>Pune</td>
        </tr>
    </table>

</body>
</html>
