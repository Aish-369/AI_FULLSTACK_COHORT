<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Div Tag</h1>
    <hr>

    <!-- one box in a row -->
    <div style="height: 400px; width:100% ; background-color:red;"></div>

    <!-- two boxes in a row -->
    <div style="height: 400px; width:50% ; background-color:rgb(0, 225, 255); float:left;"></div>
    <div style="height: 400px; width:50% ; background-color:rgb(208, 255, 0);float:left;"></div>

    <!-- three boxes in a row -->
    <div style="height: 400px; width:33.33%; background-color:rgb(30, 0, 255); float:left;"></div>
    <div style="height: 400px; width:33.33%; background-color:rgb(255, 0, 217);float:left;"></div>
    <div style="height: 400px; width:33.33%; background-color:rgb(255, 162, 0); float:left;"></div>

    <!-- four boxes in a row -->
    <div style="height: 400px; width:25%; background-color:rgb(33, 10, 34); float:left;"></div>
    <div style="height: 400px; width:25%; background-color:rgb(255, 142, 238);float:left;"></div>
    <div style="height: 400px; width:25%; background-color:rgb(126, 81, 199); float:left;"></div>
    <div style="height: 400px; width:25%; background-color:rgb(213, 206, 193); float:left;"></div>



</body>
</html>
