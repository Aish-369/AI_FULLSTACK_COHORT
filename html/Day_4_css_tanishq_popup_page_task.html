<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tanishq</title>

    <style>

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }


        /* BACKGROUND IMAGE */

        .image {

            height: 700px;
            width: 100%;

            background-image:

                linear-gradient(
                    rgba(157, 131, 131, 0.8),
                    rgba(157, 131, 131, 0.8)
                ),

                url("../assest/background_image_tanishq.png");

            background-repeat: no-repeat;

            background-position: center;

            background-size: cover;

            position: relative;
        }


        /* POPUP BOX */

        .image2 {

            height: 470px;
            width: 470px;

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0px 0px 20px
                rgba(164, 25, 25, 0.5);

            background-color:
            rgba(141, 47, 47, 0.95);
            background-color: #82282a;
            color: white;

            text-align: center;

            padding: 30px;
            url("../assest/tanishq_popup_img.png");

            background-repeat: no-repeat;

            background-position: center;

            background-size: cover;

            position: relative;
        }


        /* CLOSE BUTTON */

        .close {

            position: absolute;

            right: 12px;

            top: 8px;

            font-size: 25px;

            font-weight: bold;

            cursor: pointer;
        }


        /* TANISHQ LOGO */

        .logo {

            font-size: 55px;

            margin-top: 5px;

            font-family: Georgia, serif;
        }


        /* BRAND NAME */

        .brand-name {

            font-size: 35px;

            font-family: Georgia, serif;

            margin-top: -5px;

            letter-spacing: 2px;
        }


        /* HEADING */

        .image2 h1 {

            font-size: 28px;

            line-height: 1.2;

            margin-top: 45px;

            font-family: Georgia, serif;
        }


        /* PARAGRAPH */

        .image2 p {

            font-size: 16px;

            line-height: 1.5;

            margin-top: 15px;
        }


        /* BUTTON */

        .image2 button {

            margin-top: 28px;

            padding: 12px 25px;

            background-color: white;

            color: black;

            border: none;

            border-radius: 5px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        /* BUTTON HOVER */

        .image2 button:hover {

            background-color: #eeeeee;

        }

    </style>

</head>


<body>


    <!-- BACKGROUND IMAGE -->

    <div class="image">


        <!-- POPUP -->

        <div class="image2">


            <!-- CLOSE BUTTON -->

            <div class="close">
                ×
            </div>


            <!-- LOGO -->

            <div class="logo">
                <img src="../assest/tanishqlogo2.png" alt="tanishq logo" height="100px" width="200px" >

            </div>


            <!-- BRAND NAME -->

            <div class="brand-name">
                
            </div>


            <!-- HEADING -->

            <h1>

                Your Special Day is Around
                <br>

                the Corner?

            </h1>


            <!-- DESCRIPTION -->

            <p>

                If your birthday or anniversary is coming up,
                you could unlock a discount of upto 10%*.
                T&C Applied!

            </p>


            <!-- BUTTON -->

            <button>

                Find My Discount

            </button>


        </div>


    </div>


</body>

</html>
