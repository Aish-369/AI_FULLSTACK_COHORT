<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Dashboard Layout</title>
</head>

<body class="bg-gray-100 p-8">

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto bg-white rounded-lg overflow-hidden shadow-sm">

        <!-- Header -->
        <header class="h-28 bg-pink-200">
        </header>


        <!-- Content -->
        <main class="p-5">

            <div class="grid grid-cols-4 gap-5">

                <!-- Sidebar -->
                <aside class="bg-green-100 rounded-lg p-4">

                    <div class="space-y-3">

                        <div class="h-12 bg-green-200 rounded-lg"></div>
                        <div class="h-12 bg-green-200 rounded-lg"></div>
                        <div class="h-12 bg-green-200 rounded-lg"></div>
                        <div class="h-12 bg-green-200 rounded-lg"></div>
                        <div class="h-12 bg-green-200 rounded-lg"></div>
                        <div class="h-12 bg-green-200 rounded-lg"></div>
                        <div class="h-12 bg-green-200 rounded-lg"></div>
                        <div class="h-12 bg-green-200 rounded-lg"></div>
                        <div class="h-12 bg-green-200 rounded-lg"></div>

                    </div>

                </aside>


                <!-- Main Boxes -->
                <section class="col-span-3">

                    <div class="grid grid-cols-3 gap-5">

                        <!-- Row 1 -->
                        <div class="h-48 bg-indigo-200 rounded-lg"></div>
                        <div class="h-48 bg-indigo-200 rounded-lg"></div>
                        <div class="h-48 bg-indigo-200 rounded-lg"></div>

                        <!-- Row 2 -->
                        <div class="h-48 bg-indigo-200 rounded-lg"></div>
                        <div class="h-48 bg-indigo-200 rounded-lg"></div>
                        <div class="h-48 bg-indigo-200 rounded-lg"></div>

                        <!-- Row 3 -->
                        <div class="h-48 bg-indigo-200 rounded-lg"></div>
                        <div class="h-48 bg-indigo-200 rounded-lg"></div>
                        <div class="h-48 bg-indigo-200 rounded-lg"></div>

                    </div>

                </section>

            </div>

        </main>


        <!-- Footer -->
        <footer class="h-24 bg-pink-200">
        </footer>

    </div>

</body>
</html>
