<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nested Div</h1>
    <hr>

    <div style="height: 300px;width:100%;background-color:orange;float:left">
        <div style="height: 100%;width:50%;background-color:rgb(3, 47, 47);float:left"></div>
    </div>


    <div style="height: 300px;width:100%;background-color:aqua;float:left">
        <div style="height: 50%;width:50%;float:left;background-color:rgb(180, 34, 168)">
            <div style="height: 100%; width:33.33%;float:left;background-color:rgb(158, 255, 60)"></div>
            <div style="height: 100%; width:33.33%;float:left;background-color:rgb(255, 0, 0)"></div>
            <div style="height: 100%; width:33.33%;float:left;background-color:rgb(43, 0, 255)"></div>
        </div>
        <div style="height: 50%;width:50%;float:left;background-color:rgb(229, 255, 0)"></div>
        <div style="height: 50%;width:50%;float:left;background-color:rgb(255, 81, 0)"></div>
        <div style="height: 50%;width:50%;float:left;background-color:rgb(255, 0, 128)"></div>
    </div>

    
    <div style="height: 300px;width:100%;background-color:250, 227, 163;float:left"></div>
</body>
</html>
