        <li>Frontend

                <li>HTML</li>

    </ol>


    <ul>
        <li>Backend
            <ul>
                <li>Java</li>
                <li>NodeJs</li>
                <li>Python</li>
            </ul>
        </li>
    </ul>


    <ul>
        <li>Database

                <li>MongoDB</li>
                <li>Postgres</li>
            </ul>
        </li>
