<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .section{
            /*background:url(path)   background-repeat  background-position  background-size */
            background:url( ../assets/vishnu.jpg  ) no-repeat center center/cover;

            /* background-attachment - used to fix image to the screen after scrolling*/
            background-attachment:fixed ;
        }
    </style>
</head>
<body>
    <!--
    background-image -: for set image in the background of the content
    background:url(path)   background-repeat  background-position/background-size
    background-attachment:fixed; - used to fix image to the screen -->

    <div class="section"></div>
</body>
</html>
