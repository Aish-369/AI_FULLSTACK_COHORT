<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <h1>Box Model</h1>
    <hr>
<!-- everything in html is a box
    it can be either inline or block level
    it contains margin,padding and border

    margin - outside space
        margin:50px; space from all side
        margin:50px 100px;  space from top-bottom,left-right
        margin:50px 100px 200px;  space from top,left-right,bottom
        margin:50px 100px 200px 150px;  space from top,right,bottom,left

    padding - inside space(it might be change your hight and width)
        padding:50px; space from all side
        padding:50px 100px;  space from top-bottom,left-right
        padding:50px 100px 200px;  space from top,left-right,bottom
        padding:50px 100px 200px 150px;  space from top,right,bottom,left

    border - apply line around to the box
        border:border-style border-width border-color
        border-top,border-right,border-left,border-bottom
        Example -: border:solid 10px red
        border types -(solid/dotted/groove/double/inset)

    border radius - for curve the edges of box
    Example -: border-radius:20px
                border-radius:20px 30px (top-left,bottom-right)(top-right,bottom-left)
                border-radius:20px 30px 40px (top-left,bottom-right)(top-right,bottom-left) -->
                
</body>
</html>
