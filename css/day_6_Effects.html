<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    apply shadow for box and having 5 values(x-axis ,y-axis,blur, spread, color)
        1.box-shadow:2px 2px 10px 3px orange;

        to get ready made box shadow effect - www.getcss.com

    apply shadow to text having 4 values (x-axis ,y-axis,blur, color)
        2.text-shadow:2px 2px 10px orange

    apply hover effect to the element
    it is pseudo class selector
        3. .box:hover{
                        background-color:yellow;
                    }


    apply effect smoothly over specific period of time
        4.transition:property
        all property in one line-:
            transition:all 2s ease;

        all property separate-:
            transition-property:all;
            transition-duration:0.6s;
            transition-delay:4s;
            transition-timing-function:ease/ease in/ease out;

    to zoom-in zoom-out 2d 3d effect using  hover selector
        5.transform:property;
            transform:rotate(90deg);                rotate clockwise,anticlockwise
            transform:scale(1.4);                   zoom-in, zoom-out
            transform:translate(150px,140px);       move box on screen

    to handle overflow\extra content
        6.overflow:hidden;
        overflow:scroll;


    to apply mixture of colors
        background:linear-gradient();       set color line by line
        background:radial-gradient();       start color from center point
        background:conic-gradient();
    -->
</body>
</html>
