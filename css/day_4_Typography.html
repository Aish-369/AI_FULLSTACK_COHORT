<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <!-- add external fonts in our project from google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Guides&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }



        h2{
            /*text-align: -:center/left/right/justify;*/
            text-align: justify;
            padding: 15px;
            background-color: orange;
            border: 2px solid purple;
            border-radius: 5px;


            /*used to apply space to the starting of paragraph*/
            text-indent: 20px;

            /* space between two words */
            word-spacing: 20px;

            /* space between two letter */
            letter-spacing: 20px;

            /* space between two lines */
            line-height: 50px;
                /* or */
            line-height: 1.2;

            /* to add (overline,underline,line-through,none,) under and over the line of text  */
            text-decoration: underline;

            /* convert text into (uppercase,lowercase,capitalize)  */
            text-transform: capitalize;


            /*font Properties  */

            /* to change size of font */
            font-size: 30px;

            /* to set weight/width of font (bold,bolder,lighter,normal) */
            font-weight: bold;

            /* to set style of font (italic,oblique) */
            font-style: italic;

            /* change font variant (normal,small-caps) */
            font-variant: small-caps;

            /* change font */
            font-family:"Playwrite NZ Guides", cursive;
        }
    </style>
</head>
<body>
    <h1>Typography in Css</h1>
    <hr>

    <h2 class="lines">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Voluptatum, illo.</h2>
</body>
</html>
