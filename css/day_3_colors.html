<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .heading{
            color: orange;
            padding: 40px;
            background-color: aquamarine;

            /* hexcode */
            background-color: #ffffff;

            /* rgb */
            background-color: rgb(0,0,0);
            background-color: rgb(154,234,111);

            /* rgba */
            background-color: rgba(0,0,255,0.1);

            /* hsl */
            background-color: hsl(360,80%,50%);
        }
    </style>
</head>
<body>
    <!-- ways to apply color
    1.colorname-"orange";
    2.hexcode (#rrggbb)
    3.rgb- rgb(0-255,0-255,0-255)
    4.rgba- used for rgba(0-255,0-255,0-255,0-1)
    5.hsl(hue,saturation,lightness)-hsl(0-360,0-100%,0-100%) -->

    <h1 class="heading">welcome to css color</h1>
</body>
</html>
