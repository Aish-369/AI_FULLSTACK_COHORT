<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1{
            font-size: 1em;
            font-size: 3rem;
        }

        .box{
            height: 100vh;
            width: 100%;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Units & Dimensions</h1>
    <hr>

    <!--
    px - 96 inch = 1px
    % - percentage of actual percent
    em - (emphieral unit) font size according to multiple of their parent element size
    rem - ( root emphieral unit) font size according to  their root element size -->


    <!--
    vh - viewport height-100% of the screen
    vw - viewport width-100% of the screen -->

    <div class="box">

    </div>
</body>
</html>
